<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiles · Patrick Lei</title>
<meta name="color-scheme" content="light dark">
<style>
/* Candidate 1: Tiles. The home page is a workspace in a tiling window
   manager. Each section is a window; open several and they split the screen
   in a dwindle layout, the way hyprland does. Nothing is hidden: an empty
   workspace shows the wallpaper, which is the name and the keymap. */

@font-face { font-family: Iosevka; font-weight: 400; src: url("../public/fonts/iosevka-regular.woff2") format("woff2"); }
@font-face { font-family: Iosevka; font-weight: 700; src: url("../public/fonts/iosevka-bold.woff2") format("woff2"); }
@font-face { font-family: Iosevka; font-style: italic; src: url("../public/fonts/iosevka-italic.woff2") format("woff2"); }
@font-face { font-family: Lato; font-weight: 400; src: url("../public/fonts/lato-regular.woff2") format("woff2"); }
@font-face { font-family: Lato; font-weight: 700; src: url("../public/fonts/lato-bold.woff2") format("woff2"); }
@font-face { font-family: Lato; font-style: italic; src: url("../public/fonts/lato-italic.woff2") format("woff2"); }

:root {
  /* Everforest, light and dark hard. */
  --bg: #fdf6e3;
  --bg-dim: #f4f0d9;
  --bg-pane: #fffbef;
  --fg: #5c6a72;
  --fg-strong: #2d3b40;
  --grey: #939f91;
  --green: #8da101;
  --blue: #3a94c5;
  --red: #f85552;
  --yellow: #dfa000;
  --purple: #df69ba;
  --aqua: #35a77c;
  --rule: #e0dcc7;
  --mono: Iosevka, ui-monospace, Menlo, monospace;
  --sans: Lato, "Helvetica Neue", Arial, sans-serif;
  --gap: 10px;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #272e33;
    --bg-dim: #1e2326;
    --bg-pane: #2e383c;
    --fg: #d3c6aa;
    --fg-strong: #e9e3cf;
    --grey: #7a8478;
    --green: #a7c080;
    --blue: #7fbbb3;
    --red: #e67e80;
    --yellow: #dbbc7f;
    --purple: #d699b6;
    --aqua: #83c092;
    --rule: #414b50;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-dim);
  color: var(--fg);
  font: 400 15px/1.55 var(--sans);
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---- Bar (think waybar) ---- */
.bar {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  padding: 6px 12px;
  font: 400 13px/1 var(--mono);
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.bar .who { color: var(--fg-strong); font-weight: 700; }
.bar .who small { color: var(--grey); font-weight: 400; margin-left: .75ch; }
.ws { display: flex; gap: 2px; margin-left: auto; }
.ws button {
  padding: 5px 9px;
  border-radius: 4px;
  color: var(--grey);
  display: inline-flex;
  gap: .6ch;
  align-items: baseline;
}
.ws button b { font-weight: 700; color: var(--fg); }
.ws button:hover { background: var(--bg-dim); color: var(--fg-strong); }
.ws button[aria-pressed="true"] { background: var(--green); color: var(--bg); }
.ws button[aria-pressed="true"] b { color: var(--bg); }
.bar .clock { color: var(--grey); min-width: 5ch; text-align: right; }
@media (max-width: 760px) {
  .ws button span { display: none; }
  .bar { gap: .75rem; }
}

/* ---- Workspace ---- */
.workspace {
  position: relative;
  padding: var(--gap);
  min-height: 0;
}
.wall {
  position: absolute;
  inset: var(--gap);
  display: grid;
  place-content: center;
  text-align: center;
  color: var(--grey);
  pointer-events: none;
  transition: opacity .25s;
}
.wall h1 {
  margin: 0;
  font: 700 clamp(2.4rem, 7vw, 5rem)/1 var(--mono);
  color: var(--fg-strong);
  letter-spacing: -0.03em;
}
.wall p { margin: .5rem 0 0; font: 400 1.05rem/1.5 var(--mono); }
.wall .keys {
  margin: 2.5rem auto 0;
  display: inline-grid;
  grid-template-columns: auto auto;
  gap: .35rem 1.5rem;
  text-align: left;
  font: 400 13px/1.6 var(--mono);
}
.wall .keys kbd { color: var(--fg); }
.wall .keys span { color: var(--grey); }
.workspace.has-panes .wall { opacity: 0; }

/* A dwindle layout: nested splits. Each .split is a flex row or column with
   two children; the second child of a row is split as a column, and so on. */
.tree { position: absolute; inset: var(--gap); display: flex; }
.tree > * { flex: 1; min-width: 0; min-height: 0; }
.split { display: flex; gap: var(--gap); }
.split.row { flex-direction: row; }
.split.col { flex-direction: column; }
.split > * { flex: 1; min-width: 0; min-height: 0; }

.pane {
  display: flex;
  flex-direction: column;
  background: var(--bg-pane);
  border: 2px solid var(--rule);
  border-radius: var(--radius);
  overflow: hidden;
  animation: open .16s ease-out;
}
@media (prefers-reduced-motion: reduce) { .pane { animation: none; } }
@keyframes open { from { transform: scale(.97); opacity: 0; } }
.pane.focused { border-color: var(--green); }
.pane.zoomed { position: absolute; inset: 0; z-index: 2; }
.pane-title {
  display: flex;
  align-items: center;
  gap: .75ch;
  padding: 6px 10px;
  font: 400 13px/1 var(--mono);
  color: var(--grey);
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  cursor: default;
}
.pane.focused .pane-title { color: var(--fg); }
.pane-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
.pane.focused .pane-title .dot { background: var(--green); }
.pane-title .path { color: var(--fg-strong); }
.pane-title .actions { margin-left: auto; display: flex; gap: 2px; }
.pane-title button { padding: 2px 6px; border-radius: 3px; color: var(--grey); }
.pane-title button:hover { background: var(--bg-dim); color: var(--fg-strong); }
.pane-body {
  padding: 1rem 1.25rem 1.5rem;
  overflow: auto;
  flex: 1;
  max-width: 100%;
}
.pane-body > * { max-width: 62ch; }
.pane-body h2 { margin: 0 0 .75rem; font: 700 1.3rem/1.2 var(--sans); color: var(--fg-strong); }
.pane-body h3 { margin: 1.5rem 0 .4rem; font: 700 .95rem/1.3 var(--sans); color: var(--fg-strong); }
.pane-body p, .pane-body ul { margin: 0 0 .9rem; }
.pane-body ul { padding-left: 1.2rem; }
.pane-body .mono { font-family: var(--mono); font-size: 13px; }
.pane-body .muted { color: var(--grey); }

/* A list that reads like `ls -l`. */
.ls { font: 400 13px/1.7 var(--mono); border-collapse: collapse; width: 100%; max-width: 70ch; }
.ls td { padding: 1px 1.5ch 1px 0; vertical-align: baseline; white-space: nowrap; }
.ls td:last-child { white-space: normal; }
.ls .d { color: var(--grey); }
.ls .k { color: var(--purple); }
.ls a { color: var(--blue); }

.portrait { width: 96px; height: 96px; border-radius: var(--radius); float: right; margin: 0 0 .5rem 1rem; }

.now li { margin-bottom: .3rem; }
.now li::marker { color: var(--yellow); }

.places { display: flex; flex-wrap: wrap; gap: .4rem; padding: 0; list-style: none; }
.places li { padding: .15rem .6rem; border: 1px solid var(--rule); border-radius: 999px; font: 400 13px/1.6 var(--mono); }

.contact dt { color: var(--grey); font: 400 13px/1.7 var(--mono); }
.contact dd { margin: 0 0 .5rem; }

@media (max-width: 760px) {
  .split.row { flex-direction: column; }
}
</style>

<script>
(() => {
  const order = ["about", "seminars", "notes", "travel", "now", "uses", "contact"];
  const tree = document.getElementById("tree");
  const workspace = document.getElementById("workspace");
  const MAX = 4;
  let open = [];       // ids in opening order
  let focused = null;  // id
  let zoomed = null;   // id

  function makePane(id) {
    const pane = document.createElement("section");
    pane.className = "pane";
    pane.dataset.id = id;
    pane.setAttribute("aria-label", id);
    pane.tabIndex = -1;
    pane.innerHTML = `
      <div class="pane-title">
        <span class="dot"></span>
        <span class="path">~/${id}</span>
        <span class="actions">
          <button data-act="zoom" title="Zoom (f)" aria-label="Zoom ${id}">⤢</button>
          <button data-act="close" title="Close (q)" aria-label="Close ${id}">×</button>
        </span>
      </div>
      <div class="pane-body"></div>`;
    pane.querySelector(".pane-body").append(document.getElementById("t-" + id).content.cloneNode(true));
    pane.addEventListener("mousedown", () => focus(id));
    pane.addEventListener("focusin", () => focus(id));
    pane.querySelector('[data-act="close"]').addEventListener("click", (e) => { e.stopPropagation(); close(id); });
    pane.querySelector('[data-act="zoom"]').addEventListener("click", (e) => { e.stopPropagation(); zoom(id); });
    return pane;
  }

  // Dwindle: [a, b, c, d] -> row(a, col(b, row(c, d))). Existing pane
  // elements are moved, not rebuilt, so their scroll position survives.
  function layout() {
    const panes = new Map([...tree.querySelectorAll(".pane")].map((p) => [p.dataset.id, p]));
    const build = (ids, dir) => {
      if (ids.length === 1) return panes.get(ids[0]) || makePane(ids[0]);
      const s = document.createElement("div");
      s.className = "split " + dir;
      s.append(build([ids[0]], dir), build(ids.slice(1), dir === "row" ? "col" : "row"));
      return s;
    };
    tree.replaceChildren();
    if (open.length) tree.append(build(open, "row"));
    workspace.classList.toggle("has-panes", open.length > 0);
    for (const b of document.querySelectorAll(".ws button")) {
      b.setAttribute("aria-pressed", String(open.includes(b.dataset.open)));
    }
    paint();
  }

  function paint() {
    for (const p of tree.querySelectorAll(".pane")) {
      p.classList.toggle("focused", p.dataset.id === focused);
      p.classList.toggle("zoomed", p.dataset.id === zoomed);
    }
    history.replaceState(null, "", open.length ? "#" + open.join(",") : location.pathname);
  }

  function focus(id) {
    if (focused === id) return;
    focused = id;
    paint();
  }

  function toggle(id) {
    if (open.includes(id)) {
      if (focused === id) close(id);
      else { focus(id); tree.querySelector(`.pane[data-id="${id}"]`)?.focus({ preventScroll: true }); }
      return;
    }
    if (open.length >= MAX) open.shift(); // the oldest window makes room
    open.push(id);
    focused = id;
    zoomed = null;
    layout();
    tree.querySelector(`.pane[data-id="${id}"]`)?.focus({ preventScroll: true });
  }

  function close(id) {
    const i = open.indexOf(id);
    if (i < 0) return;
    open.splice(i, 1);
    if (zoomed === id) zoomed = null;
    if (focused === id) focused = open[Math.min(i, open.length - 1)] ?? null;
    layout();
  }

  function zoom(id) {
    zoomed = zoomed === id ? null : id;
    focused = id;
    paint();
  }

  function moveFocus(delta) {
    if (!open.length) return;
    const i = Math.max(0, open.indexOf(focused));
    const next = open[(i + delta + open.length) % open.length];
    focus(next);
    tree.querySelector(`.pane[data-id="${next}"]`)?.focus({ preventScroll: true });
  }

  for (const b of document.querySelectorAll(".ws button")) {
    b.addEventListener("click", () => toggle(b.dataset.open));
  }

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.matches("input, textarea, select")) return;
    const n = Number(e.key);
    if (n >= 1 && n <= order.length) { toggle(order[n - 1]); e.preventDefault(); return; }
    switch (e.key) {
      case "h": case "ArrowLeft": case "k": case "ArrowUp": moveFocus(-1); break;
      case "l": case "ArrowRight": case "j": case "ArrowDown": moveFocus(1); break;
      case "f": if (focused) zoom(focused); break;
      case "q": if (focused) close(focused); break;
      case "Escape": open = []; focused = zoomed = null; layout(); break;
      default: return;
    }
    e.preventDefault();
  });

  // Deep links: #about,now opens those windows.
  const initial = location.hash.slice(1).split(",").filter((x) => order.includes(x));
  for (const id of initial.slice(0, MAX)) { open.push(id); }
  focused = open[open.length - 1] ?? null;
  layout();

  const clock = document.getElementById("clock");
  const tick = () => { clock.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); };
  tick(); setInterval(tick, 30000);
})();
</script>
