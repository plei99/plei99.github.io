<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit · Patrick Lei</title>
<style>
/* Candidate 5: Transit. The site drawn as a metro map. Two lines share an
   interchange at About: the Research line runs About – Seminars – Notes –
   arXiv, the Life line About – Travel – Now – Uses. Contact is the short
   shuttle off Uses. Choosing a station opens a signage-style card; the arrow
   keys ride the line to the next station. Hover a line to isolate it. */

@font-face { font-family: Lato; font-weight: 400; src: url("../public/fonts/lato-regular.woff2") format("woff2"); }
@font-face { font-family: Lato; font-weight: 700; src: url("../public/fonts/lato-bold.woff2") format("woff2"); }
@font-face { font-family: Lato; font-style: italic; src: url("../public/fonts/lato-italic.woff2") format("woff2"); }

:root {
  --bg: #ffffff;
  --ink: #000000;
  --grey: #6d6e71;
  --rule: #d9d9d9;
  --research: #0039a6;   /* blue */
  --life: #00933c;       /* green */
  --shuttle: #ff6319;    /* orange */
  --sign: #000000;
  --sans: Lato, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1.05rem/1.5 var(--sans);
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100%;
  overflow: hidden;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }

/* ---- Header as a station sign ---- */
.sign {
  background: var(--sign);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: .75rem 1.25rem;
}
.sign h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
.sign .sub { color: #cfcfcf; font-size: .95rem; }
.sign .legend { margin-left: auto; display: flex; gap: 1.25rem; font-size: .9rem; }
.legend span::before {
  content: ""; display: inline-block; width: .8em; height: .8em; border-radius: 50%;
  margin-right: .45em; vertical-align: -.08em; background: var(--c);
}
@media (max-width: 640px) { .sign .legend { display: none; } .sign h1 { font-size: 1.2rem; } }

/* ---- Map ---- */
.stage { position: relative; min-height: 0; }
.map { width: 100%; height: 100%; display: block; }
.line { fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; transition: opacity .2s; }
.line.research { stroke: var(--research); }
.line.life { stroke: var(--life); }
.line.shuttle { stroke: var(--shuttle); }
.map.focus-research .line:not(.research), .map.focus-life .line:not(.life), .map.focus-shuttle .line:not(.shuttle) { opacity: .18; }
.map.focus-research .station:not([data-lines~="research"]),
.map.focus-life .station:not([data-lines~="life"]),
.map.focus-shuttle .station:not([data-lines~="shuttle"]) { opacity: .25; }
.station { cursor: pointer; transition: opacity .2s; }
.station circle { fill: #fff; stroke: var(--ink); stroke-width: 4; }
.station.interchange circle { stroke-width: 5; }
.station text { font: 700 17px var(--sans); fill: var(--ink); }
.station .sub { font: 400 13px var(--sans); fill: var(--grey); }
.station:hover circle, .station:focus-visible circle { fill: var(--ink); }
.station:hover text, .station:focus-visible text { text-decoration: underline; }
.station.here circle { fill: var(--ink); }
.station.here .ring { fill: none; stroke: var(--ink); stroke-width: 2; opacity: .5; animation: pulse 2s ease-out infinite; }
@keyframes pulse { from { r: 12; opacity: .6; } to { r: 28; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .station.here .ring { animation: none; r: 16; } }
.ring { display: none; }
.station.here .ring { display: block; }
.exit text { font: 400 13px var(--sans); fill: var(--grey); }
.exit path { fill: none; stroke: var(--grey); stroke-width: 1.5; stroke-dasharray: 4 4; }
.line-label { font: 700 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.line-label.research { fill: var(--research); }
.line-label.life { fill: var(--life); }
.line-label.shuttle { fill: var(--shuttle); }

/* ---- Station card ---- */
.card {
  position: absolute;
  right: 1.25rem;
  bottom: 1.25rem;
  width: min(30rem, calc(100% - 2.5rem));
  max-height: calc(100% - 2.5rem);
  display: flex;
  flex-direction: column;
  background: #fff;
  border: 3px solid var(--ink);
  box-shadow: 8px 8px 0 var(--ink);
  transform: translateY(16px);
  opacity: 0;
  pointer-events: none;
  transition: transform .2s ease, opacity .2s ease;
}
.card.open { transform: none; opacity: 1; pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
.card-head {
  background: var(--sign);
  color: #fff;
  padding: .75rem 1rem;
  display: flex;
  align-items: center;
  gap: .75rem;
}
.card-head .bullets { display: flex; gap: .35rem; }
.card-head .bullet {
  width: 1.6rem; height: 1.6rem; border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 700; font-size: .95rem; color: #fff;
  background: var(--c);
}
.card-head h2 { margin: 0; font-size: 1.25rem; }
.card-head .close { margin-left: auto; background: none; border: 0; color: #fff; font-size: 1.4rem; line-height: 1; padding: 0 .25rem; }
.card-body { padding: 1rem 1.25rem 1.25rem; overflow: auto; }
.card-body h3 { margin: 1rem 0 .4rem; font-size: 1rem; }
.card-body p, .card-body ul { margin: 0 0 .8rem; }
.card-body ul { padding-left: 1.2rem; }
.card-body li { margin-bottom: .25rem; }
.card-body .muted { color: var(--grey); }
.card-body table { border-collapse: collapse; width: 100%; font-size: .95rem; }
.card-body td { padding: .3rem .75rem .3rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.card-body td:first-child { white-space: nowrap; color: var(--grey); }
.card-body img { float: right; width: 5.5rem; height: 5.5rem; margin: 0 0 .5rem 1rem; border: 2px solid var(--ink); }
.card-foot {
  border-top: 3px solid var(--ink);
  display: flex;
  justify-content: space-between;
  gap: .5rem;
  padding: .6rem .75rem;
  font-size: .95rem;
}
.card-foot button { background: none; border: 0; padding: .25rem .4rem; font-weight: 700; }
.card-foot button:hover { text-decoration: underline; }
.card-foot button:disabled { color: var(--rule); text-decoration: none; cursor: default; }
.card-foot .mid { color: var(--grey); align-self: center; }

.help {
  position: absolute; left: 1.25rem; bottom: 1.25rem;
  font-size: .85rem; color: var(--grey);
}
.help kbd { color: var(--ink); }
@media (max-width: 640px) {
  .map { height: 44%; }
  .card { right: 0; bottom: 0; width: 100%; max-height: 56%; border-width: 3px 0 0; box-shadow: none; }
  .help { display: none; }
  .station text { font-size: 15px; }
}
</style>
</head>

</main>

  <p>You may also know me from <a href="https://www.umass.edu/mathematics-statistics/">UMass Amherst</a>, where I was advised by <a href="https://paulhacking.github.io/">Paul Hacking</a> and also majored in computer science.</p>

<script>
(() => {
  const lines = {
    research: { name: "Research line", letter: "R", stops: ["start", "about", "seminars", "notes", "arxiv"] },
    life:     { name: "Life line",     letter: "L", stops: ["start", "about", "travel", "now", "uses"] },
    shuttle:  { name: "Contact shuttle", letter: "C", stops: ["uses", "contact"] },
  };
  const titles = { start: "Home", about: "About", seminars: "Seminars", notes: "Notes", arxiv: "arXiv", travel: "Travel", now: "Now", uses: "Uses", contact: "Contact" };
  const map = document.getElementById("map");
  const card = document.getElementById("card");
  const body = document.getElementById("card-body");
  const title = document.getElementById("card-title");
  const bullets = document.getElementById("bullets");
  const lineName = document.getElementById("line-name");
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  let here = null, riding = "research";

  function linesOf(id) { return Object.keys(lines).filter((l) => lines[l].stops.includes(id)); }

  function show(id, line) {
    here = id;
    if (line && linesOf(id).includes(line)) riding = line;
    else if (!linesOf(id).includes(riding)) riding = linesOf(id)[0];
    const t = document.querySelector(`template[data-id="${id}"]`);
    body.replaceChildren(t.content.cloneNode(true));
    body.scrollTop = 0;
    title.textContent = titles[id];
    bullets.replaceChildren(...linesOf(id).map((l) => {
      const b = document.createElement("span");
      b.className = "bullet"; b.style.setProperty("--c", `var(--${l})`); b.textContent = lines[l].letter;
      b.title = lines[l].name;
      return b;
    }));
    const stops = lines[riding].stops, i = stops.indexOf(id);
    lineName.textContent = lines[riding].name;
    prev.disabled = i <= 0; next.disabled = i >= stops.length - 1;
    prev.textContent = i > 0 ? `← ${titles[stops[i - 1]]}` : "←";
    next.textContent = i < stops.length - 1 ? `${titles[stops[i + 1]]} →` : "→";
    card.classList.add("open");
    for (const s of map.querySelectorAll(".station")) s.classList.toggle("here", s.dataset.id === id);
    history.replaceState(null, "", "#" + id);
  }
  function ride(delta) {
    if (!here) return show("start");
    const stops = lines[riding].stops, i = stops.indexOf(here) + delta;
    if (i >= 0 && i < stops.length) show(stops[i], riding);
  }

  for (const s of map.querySelectorAll(".station")) {
    s.addEventListener("click", () => show(s.dataset.id));
    s.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); show(s.dataset.id); } });
  }
  for (const p of map.querySelectorAll(".line")) {
    p.addEventListener("mouseenter", () => map.classList.add("focus-" + p.dataset.line));
    p.addEventListener("mouseleave", () => map.classList.remove("focus-" + p.dataset.line));
    p.addEventListener("click", () => { riding = p.dataset.line; show(lines[riding].stops[here && lines[riding].stops.includes(here) ? lines[riding].stops.indexOf(here) : 1], riding); });
  }
  prev.addEventListener("click", () => ride(-1));
  next.addEventListener("click", () => ride(1));
  document.getElementById("close").addEventListener("click", () => { card.classList.remove("open"); here = null; for (const s of map.querySelectorAll(".station")) s.classList.remove("here"); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") ride(1);
    else if (e.key === "ArrowLeft") ride(-1);
    else if (e.key === "Escape") document.getElementById("close").click();
    else return;
    e.preventDefault();
  });

  const start = location.hash.slice(1);
  show(titles[start] ? start : "start");
})();
</script>
