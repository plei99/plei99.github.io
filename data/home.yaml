bio:
  en: |
    I am a Visiting Assistant Professor (postdoc) in mathematics at
    Boston College, mentored by <a href="https://sites.google.com/bc.edu/qile-chen/">Qile Chen</a>.
    Previously I completed my PhD at Columbia University, advised by
    <a href="https://math.columbia.edu/~ccliu">Melissa Liu</a>.
    My research is in algebraic geometry, particularly higher-genus Gromov-Witten theory.
  zh: |
    我目前在波士顿学院担任数学方向的访问助理教授（博士后），导师是
    <a href="https://sites.google.com/bc.edu/qile-chen/">陈琪乐</a>。
    此前我在哥伦比亚大学完成了博士学位，导师是
    <a href="https://math.columbia.edu/~ccliu">刘秋菊</a>。
    我的研究方向是代数几何，尤其是高亏格 Gromov-Witten 理论。
