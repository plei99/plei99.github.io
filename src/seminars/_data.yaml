# Applies to the seminar markdown pages in this directory. The index page
# overrides `type` and `layout` in its own front matter.
type: seminar
layout: layouts/seminar.vto
section: seminars
# Individual seminar pages exist only in English. `switchUrl` tells the EN/中文
# control where to go without claiming a translation, so no hreflang pair is
# emitted. The index page sets a real `altUrl` in its own front matter.
switchUrl: /zh/seminars/
