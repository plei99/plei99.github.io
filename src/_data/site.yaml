name: Patrick Lei
description:
  en: >-
    Patrick Lei is a postdoc at the Shanghai Center for Mathematical Sciences at
    Fudan University, working in algebraic geometry and higher-genus
    Gromov-Witten theory.
  zh: >-
    Patrick Lei 是复旦大学上海数学中心的博士后，研究代数几何与高亏格 Gromov-Witten 理论。

# Every destination on the site, keyed by the id the figure uses. In the figure
# the marked points of C are about, seminars and notes; the map f is travel; the
# insertions on X are papers (labelled arXiv), now and cv. The letter f is uses.
pages:
  about:
    label: { en: about me, zh: 关于我 }
    href: { en: /en/about.html, zh: /zh/about.html }
  seminars:
    label: { en: seminars, zh: 讨论班 }
    href: { en: /seminars/, zh: /zh/seminars/ }
  notes:
    label: { en: notes, zh: 笔记 }
    href: { en: /notes.html, zh: /zh/notes.html }
  travel:
    label: { en: travel, zh: 旅行 }
    href: { en: /en/travel.html, zh: /zh/travel.html }
  papers:
    label: { en: arXiv, zh: arXiv }
    href: { en: /papers.html, zh: /zh/papers.html }
  now:
    label: { en: now, zh: 最近 }
    href: { en: /en/now.html, zh: /zh/now.html }
  cv:
    label: { en: CV, zh: 简历 }
    external: true
    href:
      en: https://github.com/plei99/cv/releases/latest/download/Patrick_Lei_CV.pdf
      zh: https://github.com/plei99/cv/releases/latest/download/Patrick_Lei_CV.pdf
  uses:
    label: { en: uses, zh: 装备 }
    href: { en: /en/uses.html, zh: /zh/uses.html }

