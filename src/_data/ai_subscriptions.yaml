# One inline-Markdown string per list item under the "Notes" toggle. Empty
# items are skipped, and the toggle stays hidden until one has text.
notes:
  - en: "Calculations for ChatGPT, Claude, and Kimi were done using my actual usage. MiMo and GLM were estimated based on my token mix (cache hit vs cache miss/cache write vs output) and their published credit rules."
    zh: "ChatGPT、Claude 和 Kimi 的数字是根据我的实际用量计算的。MiMo 和 GLM 则是根据我的 token 构成（缓存命中、缓存未命中/缓存写入与输出的比例）以及它们公布的积分规则估算的。"
  - en: "I may or may not have actually bought a Kimi subscription just to test its usage limits. Note however that the mainland China subscription doesn't have a weekly limit (only a monthly one), unlike the overseas subscription. I am assuming that the monthly limit is the same on both subscriptions."
    zh: "我可能真的为了测试用量限额专门买了一个 Kimi 订阅，也可能没有。不过要注意，与海外版不同，中国大陆版订阅没有周限额（只有月限额）。这里假设两个版本的月限额相同。"
  - en: "My understanding is that it is not actually a good idea to run Astra or any Anthropic model on max, so I put in xhigh for Astra and Opus 5.5. Also, GLM-5.3 Flash benches pretty close to GLM-5.3, so it is also included. Otherwise, I included only the highest-scoring model for each subscription."
    zh: "据我了解，用 max 跑 Astra 或任何 Anthropic 模型其实都不是好主意，所以我给 Astra 和 Opus 5.5 加上了 xhigh。另外，GLM-5.3 Flash 的跑分与 GLM-5.3 相当接近，所以也列了进来。除此之外，每个订阅只列出了得分最高的模型。"
