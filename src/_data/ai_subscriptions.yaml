# September 23 / October 2, 2026 subscription audit; AA task times added October 3.
# Dollar values retain calculation precision; the template derives task counts.
# Only aggregate findings belong here, never raw logs or account information.
copy:
  en:
    trigger: How much inference do these subscriptions buy?
    close: Close subscription comparison
    date: "Last updated October 3, 2026"
    title: What my AI subscriptions buy
    intro: >-
      Someone I know (if you are reading this, you know who you are) complained about how little usage they got with their AI subscription (which cost about $100/month), so I decided to try to estimate the value of various AI subscriptions from both US and Chinese providers. All assumptions and choices are based on the nature of the aforementioned conversation.
    reading_note: >-
      “Tasks” means a task on one of the benchmarks used in the Artificial Analysis (AA) Intelligence Index. We are assuming for now that cost/task as measured by Artificial Analysis is close to proportional to the cost/task in the real world. The index measures overall model capabilities, whereas you may find different levels of performance in your own usage.
    timing_heading: Adjust your usage timing
    timing_note: >-
      Times are Beijing time (UTC+8).
    timing_limits: >-
      Assuming no temporary promotions for GLM.
    reset: Reset timing
    preview: "{api} a month, or {tasks} tasks"
    scroll_hint: Scroll for more columns →
    plan_model: Plan / model
    price: Price / month
    score: AA score
    api_value: API value / month
    cost_task: AA cost / task
    time_task: AA time / task
    minutes: min
    seconds: seconds
    tasks: Tasks / month
    per_100: Tasks / $100

    notes: Notes
    endnote: >-
      These estimates are based on my actual usage and the subscription rules (for example session limits, weekly limits, etc).
  zh:
    trigger: 这些订阅能换来多少推理用量？
    close: 关闭订阅比较
    date: "更新于 2026 年 10 月 3 日"
    title: 我的 AI 订阅能买到多少用量
    intro: >-
      我认识的某人（如果你正在读这段话，你自己心里清楚）抱怨自己每月约 100 美元的 AI 订阅用量太少，所以我试着估算了中美各家 AI 订阅的价值。所有假设和选择都取决于上述对话的性质。
    reading_note: >-
      “任务”指 Artificial Analysis（AA）Intelligence Index 所用某个基准测试中的一个任务。我们暂且假设 AA 测得的单任务成本与实际使用中的单任务成本大致成正比。该指数衡量的是模型的整体能力，你在自己的使用中可能会看到不同的表现。
    timing_heading: 调整使用时段
    timing_note: >-
      时间均为北京时间（UTC+8）。
    timing_limits: >-
      假设 GLM 没有限时优惠。
    reset: 重置时段
    preview: "每月 {api}，即 {tasks} 个任务"
    scroll_hint: 滑动查看完整数据 →
    plan_model: 方案 / 模型
    price: 月费
    score: AA 分数
    api_value: 每月 API 等值
    cost_task: AA 单任务成本
    time_task: AA 单任务用时
    minutes: 分钟
    seconds: 秒
    tasks: 每月任务数
    per_100: 每 $100 任务数
    notes: 备注
    endnote: >-
      这些估算基于我的实际用量和各套餐规则（例如会话限额、周限额等）。

