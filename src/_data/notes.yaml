  place: Columbia
  url: https://github.com/plei99/notes/raw/main/Columbia/f2023/instantons/notes.pdf
  zh:
    name: 瞬子计数
    description: 关于瞬子计数的数学（表示论、几何、概率论）与物理（规范场论）。部分笔记由 Davis Lazowski 记录。
    date: 2023–24 学年
    place: 哥伦比亚大学

- name: Commutative algebra
