  date: Spring 2021
  place: Columbia
  url: https://github.com/plei99/notes/raw/main/Columbia/s2021/AT/notes.pdf
  zh:
    name: 代数拓扑 II
    description: 内容包括谱序列及其在球面同伦群上的应用、示性类、K-理论和 Atiyah-Singer 指标定理。
    date: 2021 年春
    place: 哥伦比亚大学

- name: The Count of Instantons
  description: >
    On the mathematics (representation theory, geometry, probability theory)
    and physics (gauge theory) of instanton counting. Notes partially taken by
