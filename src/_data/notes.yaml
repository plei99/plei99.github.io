  place: Columbia
  url: https://github.com/plei99/notes/raw/main/seminars/GRT/notes.pdf
  zh:
    name: D-模与局部化
    description: 什么是 D-模？它们如何出现在表示论中？这里介绍 Beilinson-Bernstein 局部化定理和 Kazhdan-Lusztig 猜想。
    date: 2022 年春
    place: 哥伦比亚大学

