- name: Informal enumerative geometry seminar
  description: >
    Covers a variety of topics in enumerative geometry, including GW theory, DT
    theory, and quantum K-theory and its relationship to geometric
    representation theory.
  date: Spring 2022
  place: Columbia
  url: https://github.com/plei99/notes/raw/main/seminars/IEG/notes.pdf
  zh:
    name: 计数几何非正式讨论班
    description: 涵盖计数几何中的多个主题，包括 GW 理论、DT 理论、量子 K-理论及其与几何表示论的关系。
    date: 2022 年春
    place: 哥伦比亚大学

- name: Hyperbolicity
  description: >
    When is a variety hyperbolic? How many rational points does it have? How
    many rational curves lie on it? Find out here!
