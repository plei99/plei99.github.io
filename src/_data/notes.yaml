# Each note may carry a `zh` block; Chinese pages overlay it on the English fields.
- name: Log GLSM and related topics
  description: >
    These are notes from the summer school "Log GLSM and advances in enumerative
    geometry" at Sichuan University, Meishan campus in July 2026.
  date: Summer 2026
  place: Sichuan University
  url: https://github.com/plei99/notes/raw/main/misc/sichuan/notes.pdf
  zh:
    name: Log GLSM 及相关主题
    description: 2026 年 7 月四川大学眉山校区暑期学校“Log GLSM and advances in enumerative geometry”的笔记。
    date: 2026 年夏
    place: 四川大学
  zh_translations:
    - translator: Claude
      url: https://github.com/plei99/notes/raw/main/misc/sichuan/notes-cn.pdf
    - translator: Codex
      url: https://github.com/plei99/notes/raw/main/misc/sichuan/notes-zh.pdf

- name: Higher genus GW theory
  description: >
    What does it take to prove enumerative mirror symmetry for the quintic
    3-fold in higher genus? Find out more about recent breakthroughs here.
  date: Jan 2025
  place: Simons Center
  url: https://github.com/plei99/notes/raw/main/misc/simons25/hg.pdf
  zh:
    name: 高亏格 GW 理论
    description: 要证明五次三维簇在高亏格下的计数镜像对称，需要些什么？这里介绍近年来的突破。
    date: 2025 年 1 月
    place: Simons 中心

- name: Blowup formula in GW theory
  description: >
    How do GW invariants change under birational transformations? Learn about
    Iritani's work on the subject here.
  date: Spring 2024
  place: Columbia
  url: https://github.com/plei99/notes/raw/main/seminars/blowup/BIR.pdf
  zh:
    name: GW 理论中的爆破公式
    description: GW 不变量在双有理变换下如何变化？这里介绍 Iritani 在这方面的工作。
    date: 2024 年春
    place: 哥伦比亚大学

- name: Simons Summer Math Workshop 2023
  description: >
    Covers log GW theory in both the algebraic and symplectic settings,
    topological recursion and the spin GW/Hurwitz correspondence, and
    Givental-Teleman reconstruction of semisimple CohFTs.
  date: Summer 2023
  place: Simons Center
  url: https://github.com/plei99/notes/raw/main/misc/simons2/notes.pdf
  zh:
    name: 2023 年 Simons 暑期数学研讨班
    description: 内容包括代数与辛两种框架下的 log GW 理论、拓扑递归与 spin GW/Hurwitz 对应，以及半单 CohFT 的 Givental-Teleman 重构。
    date: 2023 年夏
    place: Simons 中心

- name: Integrability, enumerative geometry, quantization
  description: >
    Covers enumerative geometry (GW/Hurwitz, GW/DT, quantum K-theory) and
    (quantum) integrable systems (KdV, W-constraints, etc).
  date: Summer 2022
  place: Simons Center
  url: https://github.com/plei99/notes/raw/main/misc/simons/notes.pdf
  zh:
    name: 可积性、计数几何与量子化
    description: 内容包括计数几何（GW/Hurwitz、GW/DT、量子 K-理论）和（量子）可积系统（KdV、W-约束等）。
    date: 2022 年夏
    place: Simons 中心

- name: Good moduli spaces, positivity, and rationality
  description: >
    When does an Artin stack admit a "reasonable" moduli space and when does
    this moduli space have nice properties (for example being (quasi-)projective,
    rational, etc)?
  date: Spring 2026
  place: Boston College
  url: https://github.com/plei99/notes/raw/main/BC/moduli/moduli.pdf
  zh:
    name: 好模空间、正性与有理性
    description: Artin 叠何时有一个“合理”的模空间？这个模空间何时具有好的性质（例如（拟）射影、有理等）？
    date: 2026 年春
    place: 波士顿学院

- name: Geometric rep theory and universal centralizers
  description: >
    Covers the geometry of complex semisimple Lie groups (Springer theory,
    wonderful/toroidal compactifications) before moving on to universal
    centralizers (and their geometry, mirror symmetry, etc).
  date: Spring 2026
  place: Boston College
  url: https://github.com/plei99/notes/raw/main/BC/grt/grt-topics.pdf
  zh:
    name: 几何表示论与万有中心化子
    description: 先讲复半单李群的几何（Springer 理论、wonderful 与 toroidal 紧化），再讲万有中心化子（及其几何、镜像对称等）。
    date: 2026 年春
    place: 波士顿学院

- name: Moduli spaces and hyperkähler manifolds
  description: >
    Covers hyperkähler manifolds, their geometry, some constructions, and
    moduli spaces of sheaves on K3 surfaces.
  date: Fall 2021
  place: Columbia
  url: https://github.com/plei99/notes/raw/main/Columbia/f2021/HK/notes.pdf
  zh:
    name: 模空间与超凯勒流形
    description: 内容包括超凯勒流形及其几何、若干构造，以及 K3 曲面上层的模空间。
    date: 2021 年秋
    place: 哥伦比亚大学

- name: Minimal Model Program
  description: >
    Ever wondered how to classify algebraic varieties up to birational
    equivalence? The MMP is the answer! Covers the basics of the MMP and the
    MMP in dimension 3.
  date: Spring 2021
  place: Zoom
  url: https://github.com/plei99/notes/raw/main/seminars/MMP/notes.pdf
  zh:
    name: 极小模型纲领
    description: 想知道如何在双有理等价的意义下分类代数簇吗？MMP 就是答案！内容包括 MMP 的基础和三维情形的 MMP。
    date: 2021 年春
    place: Zoom

- name: Class field theory
  description: >
    Covers local and global class field theory, including the proofs of the main
    theorems and some applications.
  date: Spring 2021
  place: Columbia
  url: https://github.com/plei99/notes/raw/main/Columbia/s2021/NT/notes.pdf
  zh:
    name: 类域论
    description: 内容包括局部与整体类域论、主要定理的证明以及一些应用。
    date: 2021 年春
    place: 哥伦比亚大学

- name: Algebraic topology II
  description: >
    Covers spectral sequences and applications to homotopy groups of spheres,
