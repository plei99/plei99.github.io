<div class="hero">
  <p class="hero-label">Catalogue</p>
  <h1 class="hero-name"><strong>Notes.</strong><br>Courses, seminars, workshops.</h1>
  <p class="hero-sub">
    A catalogue of TeXed notes from courses, seminars, and workshops.
  </p>
</div>

<section class="section">
  <div class="section-head">
    <span class="section-title">Notes</span>
    <span class="section-rule"></span>
  </div>
  <div class="notes-grid">
    {% for note in notes %}
    <a class="note-card" href="{{ note.url }}">
      <span class="note-meta">{{ note.date }} · {{ note.place }}</span>
      <h2 class="paper-title">{{ note.name }}</h2>
      <p class="note-description">{{ note.description }}</p>
    </a>
    {% endfor %}
  </div>
</section>
