<div class="hero">
  <p class="hero-label">Seminars</p>
  <h1 class="hero-name"><strong>Seminars.</strong><br>Organized programs.</h1>
  <p class="hero-sub">
    Seminars and reading groups I have organized.
  </p>
</div>

<section class="section">
  <div class="section-head">
    <span class="section-title">Seminars</span>
    <span class="section-rule"></span>
  </div>
  <ul class="posts-list">
    {% for seminar in seminars %}
    <li class="post-item">
      <span class="post-date">{{ seminar.date }}</span>
      <a href="/seminars/{{ seminar.slug }}/" class="post-title">{{ seminar.title }}</a>
    </li>
    {% endfor %}
  </ul>
</section>
