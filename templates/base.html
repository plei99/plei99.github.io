<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,500;1,600&display=swap" rel="stylesheet">

  <style>
    /* ─── TOKENS ─────────────────────────────────────────── */
    :root {
      --f-body:           'EB Garamond', Georgia, serif;
      --f-display:        'Cormorant Garamond', Georgia, serif;
      --f-ui:             'Barlow Condensed', sans-serif;
      --body-size:        1.08rem;
      --hero-size:        3.2rem;
      --hero-weight:      300;

      --bg:               #e9ecf2;
      --card:             #fefcf7;
      --sidebar-bg:       #f0eee8;
      --sidebar-hdr:      #141820;
      --sidebar-hdr-text: #f0eee8;

      --ink:              #181922;
      --ink-muted:        #5e5f72;
      --ink-subtle:       #9a9baa;
      --border:           #d8d5cc;

      --accent:           #2b4a80;
      --accent-light:     #e8edf8;

      --wm-color:         rgba(180,178,170,0.13);

      --fw-sidebar:       260px;
      --card-pad:         2.5rem;
      --radius:           4px;
      --shadow:           0 2px 12px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05);
    }

    /* ─── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }
    body {
      font-family: var(--f-body);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ─── SIDEBAR ────────────────────────────────────────── */
    .sidebar {
      width: var(--fw-sidebar);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      min-height: 100vh;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar-header {
      background: var(--sidebar-hdr);
      color: var(--sidebar-hdr-text);
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .sidebar-logo {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sidebar-hdr-text);
      line-height: 1.2;
    }
    .sidebar-logo a {
      color: inherit;
      text-decoration: none;
    }
    .sidebar-logo a:hover {
      color: inherit;
      text-decoration: none;
    }
    .sidebar-logo span {
      display: block;
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: rgba(240,238,232,0.55);
      text-transform: uppercase;
      margin-top: 0.15rem;
    }
    .dark-toggle {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: rgba(240,238,232,0.6);
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    .sidebar-nav {
      padding: 1rem 0;
      flex: 1;
      position: relative;
    }
    .nav-section-label {
      display: block;
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-subtle);
      padding: 0.7rem 1.5rem 0.35rem;
      background: rgba(0,0,0,0.03);
      border-top: 1px solid var(--border);
    }
    .nav-section-label:first-child { border-top: none; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.02em;
      color: var(--ink);
      padding: 0.42rem 1.5rem;
      transition: color 0.12s, background 0.12s;
    }
    .nav-link:hover { color: var(--accent); background: var(--accent-light); text-decoration: none; }
    .nav-link.active { color: var(--accent); background: var(--accent-light); }
    .sidebar-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      font-family: var(--f-ui);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--ink-subtle);
      text-transform: uppercase;
      line-height: 1.8;
    }
    .sidebar-footer a { color: var(--ink-subtle); }
    .sidebar-footer a:hover { color: var(--accent); text-decoration: none; }

    /* ─── MAIN ───────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 3rem 4rem;
      position: relative;
      overflow: hidden;
    }

    /* ─── CARD ───────────────────────────────────────────── */
    .card {
      background: var(--card);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      width: 100%;
      max-width: 720px;
      padding: var(--card-pad);
      position: relative;
      z-index: 1;
    }

    /* ─── HERO ───────────────────────────────────────────── */
    .hero {
      padding-bottom: 2rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }
    .hero-label {
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-subtle);
      margin-bottom: 0.75rem;
    }
    .hero-name {
      font-family: var(--f-display);
      font-style: italic;
      font-weight: var(--hero-weight);
      font-size: var(--hero-size);
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 0.8rem;
      letter-spacing: -0.01em;
    }
    .hero-name strong {
      font-weight: 600;
      font-style: normal;
    }
    .hero-sub {
      font-family: var(--f-body);
      font-size: var(--body-size);
      color: var(--ink-muted);
      line-height: 1.65;
      max-width: 520px;
    }
    .hero-sub em { color: var(--ink); font-style: italic; }

    /* ─── SECTION HEADERS ────────────────────────────────── */
    .section { margin-bottom: 2.25rem; }
    .section:last-child { margin-bottom: 0; }
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    .section-title {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap;
    }
    .section-rule { flex: 1; height: 1px; background: var(--border); }
    .section-more {
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      white-space: nowrap;
    }

    /* ─── PAPERS GRID ────────────────────────────────────── */
    .papers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2.25rem;
    }
    .paper-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .paper-card:hover {
      border-color: var(--accent);
      box-shadow: 0 1px 6px rgba(43,74,128,0.09);
    }
    .paper-tag {
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
      display: block;
    }
    .paper-title {
      font-family: var(--f-body);
      font-weight: 500;
      font-size: var(--body-size);
      line-height: 1.4;
      color: var(--ink);
      margin-bottom: 0.4rem;
    }
    .paper-meta {
      font-family: var(--f-body);
      font-style: italic;
      font-size: 0.82rem;
      color: var(--ink-subtle);
    }

    /* ─── POSTS LIST ─────────────────────────────────────── */
    .posts-list { list-style: none; margin-bottom: 2.25rem; }
    .post-item {
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
    }
    .post-item:first-child { border-top: 1px solid var(--border); }
    .post-date {
      font-family: var(--f-ui);
      font-weight: 500;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--ink-subtle);
      white-space: nowrap;
      flex-shrink: 0;
      width: 5.5rem;
    }
    .post-title {
      font-family: var(--f-body);
      font-size: var(--body-size);
      color: var(--ink);
      line-height: 1.4;
    }
    .post-title:hover { color: var(--accent); }
    .now-list {
      list-style: disc;
      padding-left: 1.5rem;
      font-family: var(--f-body);
      font-size: var(--body-size);
      line-height: 1.8;
      color: var(--ink);
    }
    .now-list li { margin-bottom: 0.25rem; }

    /* ─── CONTACT ────────────────────────────────────────── */
    .contact-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
    .contact-item { display: flex; flex-direction: column; gap: 0.15rem; }
    .contact-label {
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.62rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-subtle);
    }
    .contact-value { font-family: var(--f-body); font-size: 0.95rem; color: var(--accent); }
    .wide-card { max-width: 980px; }
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .note-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      min-height: 12rem;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .note-card:hover {
      border-color: var(--accent);
      box-shadow: 0 1px 6px rgba(43,74,128,0.09);
      text-decoration: none;
    }
    .note-meta {
      font-family: var(--f-ui);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-subtle);
      margin-bottom: 0.55rem;
    }
    .note-description {
      color: var(--ink-muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .paper-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 0.7rem;
      font-family: var(--f-ui);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.65rem;
    }
    .tag {
      background: var(--accent-light);
      color: var(--accent);
      border-radius: var(--radius);
      padding: 0.12rem 0.38rem;
      font-family: var(--f-ui);
      font-weight: 600;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #globe-container {
      width: 100%;
      min-height: 500px;
    }
    #globe-container svg {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      font-family: var(--f-display);
      font-weight: 600;
      line-height: 1.2;
      margin: 1.4rem 0 0.65rem;
    }
    .markdown-body p {
      color: var(--ink-muted);
      margin-bottom: 1rem;
    }
    .language-switch {
      font-family: var(--f-ui);
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(240,238,232,0.72);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 0.2rem 0.48rem;
      flex-shrink: 0;
    }
    .language-switch:hover {
      color: var(--sidebar-hdr-text);
      border-color: rgba(255,255,255,0.35);
      text-decoration: none;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { display: none; width: 100%; height: auto; position: static; min-height: unset; border-right: none; border-bottom: 1px solid var(--border); }
      .sidebar.open { display: flex; }
      .mobile-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--sidebar-hdr); color: var(--sidebar-hdr-text); }
      .mobile-bar-logo { font-family: var(--f-ui); font-weight: 700; font-size: 1rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sidebar-hdr-text); }
      .mobile-bar-logo:hover { text-decoration: none; color: var(--sidebar-hdr-text); }
      .hamburger { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(240,238,232,0.8); font-size: 1.1rem; padding: 0.25rem 0.5rem; border-radius: 3px; cursor: pointer; }
      .main { padding: 1rem; }
      .card { padding: 1.25rem; }
      .papers-grid { grid-template-columns: 1fr; }
      .notes-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 769px) {
      .mobile-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="mobile-bar">
    <a href="{% if lang == 'zh' %}/zh/{% else %}/en/{% endif %}" class="mobile-bar-logo">{{ site_name }}</a>
    <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
  </div>

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <a href="{% if lang == 'zh' %}/zh/{% else %}/en/{% endif %}">
          {{ site_name }}
          <span>{{ site_subtitle }}</span>
        </a>
      </div>
      {{ language_switch_html }}
    </div>
    <nav class="sidebar-nav">
      {{ nav_html }}
    </nav>
    <footer class="sidebar-footer">
      {{ footer_html }}
    </footer>
  </aside>

  <!-- ══ MAIN ══ -->
  <main class="main">
    <div class="card {{ card_modifier }}">
      {{ content }}
    </div>
  </main>

</body>
</html>
