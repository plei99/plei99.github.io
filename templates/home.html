<div class="hero">
  <p class="hero-label">{{ welcome }}</p>
  <h1 class="hero-name">{{ headline }}</h1>
  <p class="hero-sub">{{ bio }}</p>
</div>

<section class="section">
  <div class="section-head">
    <span class="section-title">{{ now_title }}</span>
    <span class="section-rule"></span>
    <a href="{{ now_href }}" class="section-more">{{ now_more }}</a>
  </div>
  <ul class="posts-list">
    {% for item in now_items %}
    <li class="post-item">
      <span class="post-date">Now</span>
      <span class="post-title">{{ item }}</span>
    </li>
    {% endfor %}
  </ul>
</section>

<section class="section">
  <div class="section-head">
    <span class="section-title">{{ contact_title }}</span>
    <span class="section-rule"></span>
  </div>
  <div class="contact-row">
    <div class="contact-item">
      <span class="contact-label">Email</span>
      <a href="mailto:{{ email }}" class="contact-value">{{ email }}</a>
    </div>
    <div class="contact-item">
      <span class="contact-label">GitHub</span>
      <a href="{{ github }}" class="contact-value">github.com/plei99</a>
    </div>
    <div class="contact-item">
      <span class="contact-label">arXiv</span>
      <a href="{{ arxiv }}" class="contact-value">arxiv.org/a/lei_p</a>
    </div>
  </div>
</section>
