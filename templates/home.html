<div class="hero">
  <p class="hero-label">{{ welcome }}</p>
  <h1 class="hero-name"><strong>Patrick Lei</strong></h1>
  <p class="hero-sub">{{ bio | safe }}</p>
</div>

<section class="section">
  <div class="section-head">
    <span class="section-title">{{ about_title }}</span>
    <span class="section-rule"></span>
  </div>
  <div class="about-body">
    {{ about_body | safe }}
  </div>
</section>

<section class="section">
  <div class="section-head">
    <span class="section-title">{{ contact_title }}</span>
    <span class="section-rule"></span>
  </div>
  <div class="contact-row">
    <div class="contact-item">
      <span class="contact-label">Email</span>
      <a href="mailto:{{ email }}" class="contact-value">{{ email }}</a>
    </div>
    <div class="contact-item">
      <span class="contact-label">GitHub</span>
      <a href="{{ github }}" class="contact-value">github.com/plei99</a>
    </div>
    <div class="contact-item">
      <span class="contact-label">arXiv</span>
      <a href="{{ arxiv }}" class="contact-value">my papers on arXiv</a>
    </div>
  </div>
</section>
